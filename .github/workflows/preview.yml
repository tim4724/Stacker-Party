name: Preview Deploy

on:
  push:
    branches:
      - '**'
    # The image contains only the web app + relay; native-port-only pushes
    # would rebuild and redeploy an identical image.
    paths-ignore:
      - 'android/**'
      - 'appletv/**'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docker-publish.yml
    with:
      platforms: ${{ github.ref_name == 'main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  deploy:
    runs-on: [self-hosted, k8s]
    needs: build
    environment: preview
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Write kubeconfig
        run: |
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      # One mapping for every workflow that names a preview resource, so the
      # namespace this creates is the one Preview Cleanup later deletes.
      - name: Resolve preview names
        id: names
        uses: ./.github/actions/branch-slug
        with:
          branch: ${{ github.ref_name }}

      - name: Prepare preview namespace
        uses: ./.github/actions/preview-namespace
        with:
          namespace: ${{ steps.names.outputs.namespace }}

      - name: Deploy preview to Kubernetes
        env:
          NS: ${{ steps.names.outputs.namespace }}
          HOST: ${{ steps.names.outputs.host }}
          IMAGE: ${{ needs.build.outputs.sha_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: couch-games
          spec:
            revisionHistoryLimit: 3
            replicas: 1
            selector:
              matchLabels:
                app: couch-games
            template:
              metadata:
                labels:
                  app: couch-games
              spec:
                containers:
                  - name: couch-games
                    image: ${IMAGE}
                    env:
                      - name: PUBLIC_URL
                        value: https://${HOST}
                      # APP_ENV=preview keeps the (#sha) version label and the
                      # dev CSP the AirConsole http.airconsole.com framing needs.
                      # Bundle serving comes from the image (ENV SERVE_BUNDLES=1),
                      # so previews exercise the same bundle production ships.
                      - name: APP_ENV
                        value: preview
                      - name: GIT_SHA
                        value: ${GIT_SHA}
                    ports:
                      - containerPort: 4000
                        name: http
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: couch-games
          spec:
            selector:
              app: couch-games
            ports:
              - port: 4000
                targetPort: 4000
          ---
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: redirect-to-https
          spec:
            redirectScheme:
              scheme: https
              permanent: true
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: cg-https
          spec:
            entryPoints:
              - websecure
            routes:
              - match: Host(\`${HOST}\`)
                kind: Rule
                services:
                  - name: couch-games
                    port: 4000
            tls:
              secretName: hexstacker-wildcard-tls
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: cg-http
          spec:
            entryPoints:
              - web
            routes:
              - match: Host(\`${HOST}\`)
                kind: Rule
                services:
                  - name: couch-games
                    port: 4000
                middlewares:
                  - name: redirect-to-https
          EOF

      - name: Publish preview URL
        env:
          HOST: ${{ steps.names.outputs.host }}
        run: |
          {
            echo "### Preview"
            echo "- URL: https://${HOST}"
          } >> "$GITHUB_STEP_SUMMARY"

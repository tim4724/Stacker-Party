name: AirConsole Build

on:
  push:
    tags:
      # Bare semver, the repo's release tag convention (matching release.yml).
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # The bundle step (scripts/build.js) requires esbuild from node_modules;
      # without this the build dies on MODULE_NOT_FOUND (broke every tag build
      # from 4.3.0 to 4.4.0, back when the transpile step needed it).
      - name: Install dependencies
        run: npm ci

      - name: Build AirConsole ZIP
        run: bash scripts/build-airconsole.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/hexstacker-party-airconsole-*.zip

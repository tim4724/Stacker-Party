name: Docker Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      platforms:
        description: "Target platforms for Docker build"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
    outputs:
      sha_tag:
        description: "Image tag for this commit (sha)"
        value: ${{ jobs.build.outputs.sha_tag }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha_tag: ${{ steps.out.outputs.sha_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: contains(inputs.platforms || 'linux/amd64,linux/arm64', 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}

      # The sha tag is the one callers deploy: it names this exact commit's image
      # even on a branch whose moving tag has already been overwritten.
      - name: Capture tag for output
        id: out
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          SHA_TAG=$(printf '%s' "$TAGS" | tr ',' '\n' | grep ":sha-" | head -n1)
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
